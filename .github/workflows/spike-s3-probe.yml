# S3 của Spike 1 (A-050, A-025) — chạy tools/render-probes/probe.py từ runner GitHub, để tách ảnh hưởng mạng nhà.
# TẠM THỜI: gỡ hẳn, cùng hai repo secret, ở bước 7 của S3.
# Chỉ chạy khi push lên spike/s3-do có ĐỔI tools/render-probes/run.json. Commit thường — kể cả lần push đầu của nhánh — không chạy.
# Cách dùng và ràng buộc: tools/render-probes/README.md. Tài liệu: docs/reference/github-actions-push-trigger.md.
name: spike-s3-probe

on:
  push:
    branches: [spike/s3-do]
    paths: [tools/render-probes/run.json]

concurrency:
  group: spike-s3-probe
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 345  # probe tự từ chối spec dài hơn 330 phút; trần của job GitHub-hosted là 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      - name: Kiểm secret — rỗng thì dừng ngay
        env:
          BO19_SPIKE_BASE_URL: ${{ secrets.BO19_SPIKE_BASE_URL }}
          BO19_SPIKE_TOKEN: ${{ secrets.BO19_SPIKE_TOKEN }}
        run: |
          # Chỉ báo tên secret thiếu, không bao giờ in giá trị.
          MISSING=""
          [ -z "$BO19_SPIKE_BASE_URL" ] && MISSING="$MISSING BO19_SPIKE_BASE_URL"
          [ -z "$BO19_SPIKE_TOKEN" ] && MISSING="$MISSING BO19_SPIKE_TOKEN"
          if [ -n "$MISSING" ]; then
            echo "::error title=Thiếu repo secret::Rỗng hoặc chưa tạo:$MISSING — không chạy probe. Tạo secret rồi push lại run.json."
            exit 1
          fi
          echo "secret có đủ hai giá trị (không in)"
      - name: Probe
        env:
          BO19_SPIKE_BASE_URL: ${{ secrets.BO19_SPIKE_BASE_URL }}
          BO19_SPIKE_TOKEN: ${{ secrets.BO19_SPIKE_TOKEN }}
        run: |
          # keepwarm_s > 0: gọi /healthz mỗi chừng đó giây từ ngoài, để tách spin-down khỏi giới hạn request (README).
          KW=$(python3 -c "import json;print(int(json.load(open('tools/render-probes/run.json')).get('keepwarm_s', 0)))")
          if [ "$KW" -gt 0 ]; then
            ( while true; do curl -s -o /dev/null -m 30 -w "KEEPWARM http=%{http_code} time=%{time_total}s\n" "$BO19_SPIKE_BASE_URL/healthz"; sleep "$KW"; done ) &
            KW_PID=$!
          fi
          python3 tools/render-probes/probe.py --spec tools/render-probes/run.json --out probe-out --emit
          RC=$?
          if [ -n "${KW_PID:-}" ]; then kill "$KW_PID" 2>/dev/null || true; fi
          exit $RC
