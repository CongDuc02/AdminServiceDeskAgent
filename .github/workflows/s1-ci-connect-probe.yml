# Spike 1, S1 — thử kết nối từ runner CI tới Postgres free trên Render (A-060, ADR-022).
# Chỉ chạy tay. Đọc DSN của bo19_app từ secret BO19_S1_CI_PROBE_DSN — PO thêm secret, bấm chạy,
# rồi xoá secret ngay khi có kết quả. Không echo DSN; DSN phải có sslmode=require.
# Xoá workflow này khi S1 đã ghi kết quả và CI migrate thật (ADR-022) thay thế nó.
name: s1-ci-connect-probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Cài psycopg — đúng bản của tools/contract-checks
        run: python -m pip install --disable-pip-version-check -q "psycopg[binary]==3.3.5"
      - name: Thử kết nối bằng bo19_app
        env:
          BO19_S1_CI_PROBE_DSN: ${{ secrets.BO19_S1_CI_PROBE_DSN }}
        run: |
          python - <<'PY'
          import os, sys, platform
          import psycopg
          dsn = os.environ.get("BO19_S1_CI_PROBE_DSN", "")
          if not dsn:
              sys.exit("secret BO19_S1_CI_PROBE_DSN chưa đặt")
          if "sslmode=require" not in dsn:
              sys.exit("DSN thiếu sslmode=require — dừng, không kết nối")
          print("runner:", platform.platform())
          try:
              with psycopg.connect(dsn, connect_timeout=20) as c:
                  user, ver = c.execute("select current_user, current_setting('server_version')").fetchone()
                  ssl = c.execute("select ssl from pg_stat_ssl where pid = pg_backend_pid()").fetchone()[0]
                  one = c.execute("select 1").fetchone()[0]
                  print("KẾT NỐI ĐẠT | user:", user, "| server_version:", ver, "| ssl:", ssl, "| select 1:", one)
          except Exception as e:
              print("KẾT NỐI HỎNG |", type(e).__name__)
              sys.exit(1)
          PY
