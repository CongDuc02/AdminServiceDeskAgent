<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  BO-19 — ADR-036 (PO, 2026-10-13): quy tắc ánh xạ TƯỜNG MINH "Times New Roman" -> "Liberation Serif".
  File .docx giữ nguyên tên font "Times New Roman" (mẫu thật soạn bằng Word); image không có Times New Roman
  (không có giấy phép phân phối — A-058). Việc thay font là hành vi có tên, nằm trong repo, và được bước kiểm
  khởi động #7 xác nhận bằng `fc-match "Times New Roman"`; không dựa vào quy tắc thay thế có sẵn của hệ điều hành.
  Cú pháp: docs/reference/fontconfig-debian-trixie.md (fonts-conf(5): <match>, <test>, <edit mode="assign" binding="same">).
  Dockerfile COPY file này vào /etc/fonts/conf.d/ (thư mục cấu hình quy ước của fontconfig).
-->
<fontconfig>
  <match target="pattern">
    <test qual="any" name="family">
      <string>Times New Roman</string>
    </test>
    <edit name="family" mode="assign" binding="same">
      <string>Liberation Serif</string>
    </edit>
  </match>
</fontconfig>
