[project]
name = "bo19"
version = "0.1.0"
description = "BO-19 Admin Service Desk Agent — backend rỗng DESIGN MODE"
requires-python = ">=3.11"
# Nguồn sự thật DUY NHẤT cho phụ thuộc Python của backend (đợt sửa 2b sau Phase 13, AUD-25).
# Không có requirements.txt. Lockfile: requirements-linux.lock, sinh bằng đúng lệnh ở đầu file đó, ghim
# langgraph-checkpoint qua constraints.txt (ADR-030). Sửa danh sách dưới đây thì sinh lại lock.
#
# Cố ý KHÔNG có:
#   - alembic, SQLAlchemy: ADR-017 chọn SQL-first, loại cả ORM + autogenerate lẫn Alembic viết tay.
#   - SDK của provider LLM: ADR-035 chọn gọi thẳng API dạng OpenAI bằng httpx, không SDK. Embedding: A-028 chưa chốt.
#   - langchain, langchain-core: không tài liệu thiết kế nào chọn; langchain-core đi theo langgraph như
#     phụ thuộc bắc cầu, không ghim riêng để không lệch với bản langgraph đã xác minh.
dependencies = [
    "fastapi==0.115.12",
    "uvicorn[standard]==0.34.2",
    "pydantic==2.11.3",
    "pydantic-settings==2.9.1",
    "python-multipart==0.0.9",
    "email-validator==2.2.0",
    # Token phiên stateless ký HMAC bằng secret phía server (ADR-013) — ADR-028. Không cần extra mật mã.
    "PyJWT==2.15.0",
    "psycopg[binary]==3.3.5",
    "pgvector==0.3.6",
    # Hai phiên bản dưới là bản đã chạy thật khi xác minh A-045 (docs/reference/langgraph-checkpoint-postgres.md).
    "langgraph==1.2.11",
    "langgraph-checkpoint-postgres==3.1.2",
    "python-docx==1.1.2",
    "docxtpl==0.20.1",
    "lxml==5.3.1",
    "boto3==1.37.3",
    "botocore==1.37.3",
    # Log có cấu trúc; chỉ bo19.observability.log import — ADR-029.
    "structlog==25.4.0",
    # Hash mật khẩu argon2id (ADR-021) — thư viện chọn ở ADR-034; tham số WV-16, cấu hình, không viết cứng.
    "argon2-cffi==25.1.0",
    # Client gọi provider LLM, API dạng OpenAI — ADR-035. Chỉ bo19.ai_gateway.providers import (Luật import).
    # Ghim đúng bản đã có trong lock (phụ thuộc bắc cầu của langchain-core, langgraph-sdk).
    "httpx==0.28.1",
]

# Công cụ kiểm của CI — KHÔNG vào image (ADR-030, ghi chú Cập nhật). Lock riêng: requirements-dev-linux.lock, sinh bằng đúng lệnh ở
# đầu file đó — cùng lệnh với lock của image cộng --extra dev. Tập hợp là phụ thuộc chạy + dev, để CI cài một file là đủ chạy test và
# lint-imports. Phiên bản chốt theo kết quả của chính công cụ khoá ở mốc --exclude-newer, không từ trí nhớ (CLAUDE.md, quy tắc trích dẫn).
[project.optional-dependencies]
dev = [
    "import-linter==2.15",
]

[tool.ruff]
line-length = 100
