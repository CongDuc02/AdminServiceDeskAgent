[project]
name = "bo19"
version = "0.1.0"
description = "BO-19 Admin Service Desk Agent — backend rỗng DESIGN MODE"
requires-python = ">=3.11"
# Nguồn sự thật DUY NHẤT cho phụ thuộc Python của backend (đợt sửa 2b sau Phase 13, AUD-25).
# Không có requirements.txt. Lockfile chốt ở BUILD MODE (mục Đặc tả Dockerfile của 06-structure.md).
#
# Cố ý KHÔNG có:
#   - thư viện hash mật khẩu: ADR-021 chọn argon2id; tên và phiên bản thư viện [CẦN XÁC MINH], chọn ở BUILD MODE.
#     bcrypt/passlib bị loại ở ADR-021.
#   - alembic, SQLAlchemy: ADR-017 chọn SQL-first, loại cả ORM + autogenerate lẫn Alembic viết tay.
#   - SDK của provider LLM/embedding: A-026, A-028 chưa chốt; không ghim tạm. Chỉ bo19.ai_gateway.providers
#     được import SDK provider (mục Luật import của 06-structure.md).
#   - langchain, langchain-core: không tài liệu thiết kế nào chọn; langchain-core đi theo langgraph như
#     phụ thuộc bắc cầu, không ghim riêng để không lệch với bản langgraph đã xác minh.
dependencies = [
    "fastapi==0.115.12",
    "uvicorn[standard]==0.34.2",
    "pydantic==2.11.3",
    "pydantic-settings==2.9.1",
    "python-multipart==0.0.9",
    "email-validator==2.2.0",
    # Token phiên stateless ký HMAC bằng secret phía server (ADR-013) — ADR-028. Không cần extra mật mã.
    "PyJWT==2.15.0",
    "psycopg[binary]==3.3.5",
    "pgvector==0.3.6",
    # Hai phiên bản dưới là bản đã chạy thật khi xác minh A-045 (docs/reference/langgraph-checkpoint-postgres.md).
    "langgraph==1.2.11",
    "langgraph-checkpoint-postgres==3.1.2",
    "python-docx==1.1.2",
    "docxtpl==0.20.1",
    "lxml==5.3.1",
    "boto3==1.37.3",
    "botocore==1.37.3",
    # Log có cấu trúc; chỉ bo19.observability.log import — ADR-029.
    "structlog==25.4.0",
]

[tool.ruff]
line-length = 100
