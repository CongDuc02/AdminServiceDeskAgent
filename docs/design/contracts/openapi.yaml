        - name: as
          in: query
          required: true
          schema:
            type: string
            enum: [DELEGATOR, DELEGATE]
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DelegationPage' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      tags: [delegations]
      operationId: createDelegation
      summary: Lập uỷ quyền — chỉ hình dạng
      x-bo19-operation: delegation_create
      x-bo19-permission: [delegation.manage]
      x-bo19-execution: SYNC
      x-bo19-idempotency-key: delegation
      x-bo19-scope: Should
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DelegationCreateBody' }
      responses:
        '201':
          description: Đã lập
          headers:
            Idempotent-Replayed: { $ref: '#/components/headers/IdempotentReplayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Delegation' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '500': { $ref: '#/components/responses/InternalError' }

  /delegations/{delegation_id}/actions/revoke:
    parameters:
      - $ref: '#/components/parameters/DelegationId'
    post:
      tags: [delegations]
      operationId: revokeDelegation
      summary: Thu hồi uỷ quyền — chỉ hình dạng
      x-bo19-operation: delegation_revoke
      x-bo19-permission: [delegation.manage]
      x-bo19-execution: SYNC
      x-bo19-idempotency-key: none
      x-bo19-scope: Should
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RevokeDelegationBody' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Delegation' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: bo19_session
      description: HttpOnly; Secure; SameSite=Strict; Path=/api (ADR-013). Nơi lưu phiên và thời hạn — A-048.

  headers:
    IdempotentReplayed:
      description: true khi response là lần lặp lại hợp lệ của một lệnh đã thành công
      schema: { type: boolean }

  parameters:
    CsrfHeader:
      name: X-BO19-CSRF
      in: header
      required: true
      description: Bắt buộc trên mọi lệnh không phải GET. Server chỉ kiểm sự có mặt (A-051).
      schema: { type: string, minLength: 1 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Bằng uuid của dòng chính mà lệnh ghi tạo ra (x-bo19-idempotency-key).
      schema: { type: string, format: uuid }
    AcceptEventStream:
      name: Accept
      in: header
      required: true
      schema:
        type: string
        const: text/event-stream
    Cursor:
      name: cursor
      in: query
      required: false
      description: Chuỗi mờ; dùng với bộ lọc khác thì trả VALIDATION_FAILED.
      schema: { type: string }
    Limit:
      name: limit
      in: query
      required: false
      description: Mặc định và trần TBD (A-031).
      schema: { type: integer, minimum: 1 }
    ChatSessionId:
      name: chat_session_id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    RequestId:
      name: request_id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    DocumentId:
      name: document_id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    RenderId:
      name: render_id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    TemplateId:
      name: template_id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    TemplateVersionId:
      name: template_version_id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    ImportId:
      name: import_id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    ProcedureDocumentId:
      name: procedure_document_id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    ProcedureVersionId:
      name: version_id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    RequestTypeCodePath:
      name: request_type_code
      in: path
      required: true
      schema: { $ref: '#/components/schemas/RequestTypeCode' }
    SlotNamePath:
      name: slot_name
      in: path
      required: true
      schema: { $ref: '#/components/schemas/SlotName' }
    DelegationId:
      name: delegation_id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }

  responses:
    DecisionOk:
      description: Quyết định đã ghi; bước tiếp theo chạy ở queue_worker nếu có job
      headers:
        Idempotent-Replayed: { $ref: '#/components/headers/IdempotentReplayed' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/DecisionResult' }
    BadRequest:
      description: IDEMPOTENCY_KEY_REQUIRED
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Unauthenticated:
      description: UNAUTHENTICATED · INVALID_CREDENTIALS
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Forbidden:
      description: CSRF_HEADER_MISSING · PERMISSION_DENIED · SELF_APPROVAL_BLOCKED
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    NotFound:
      description: NOT_FOUND — cả khi tài nguyên tồn tại mà người gọi không được xem
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    NotAcceptable:
      description: NOT_ACCEPTABLE
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Conflict:
      description: |
        IDEMPOTENCY_KEY_CONFLICT · STATE_CONFLICT · SEPARATION_OF_DUTIES_VIOLATION · REQUEST_NOT_EDITABLE ·
        SLOT_NOT_PROPOSED · SLOT_VALUE_STALE · REQUEST_NOT_CANCELLABLE · CHAT_SESSION_CLOSED · TURN_IN_PROGRESS ·
        TURN_NOT_FINISHED · USE_SENSITIVITY_CHANGE · DESTRUCTIVE_COUNT_CHANGED
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    PayloadTooLarge:
      description: PAYLOAD_TOO_LARGE — trần TBD (A-031)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    UnsupportedMediaType:
      description: UNSUPPORTED_MEDIA_TYPE
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Unprocessable:
      description: |
        VALIDATION_FAILED · SELF_APPROVAL_REASON_REQUIRED · REQUEST_NOT_READY · CHANGE_TARGET_INVALID ·
        TEMPLATE_VARIABLES_INVALID · IMPORT_ROWS_INVALID · DESTRUCTIVE_CONFIRMATION_REQUIRED
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    InternalError:
      description: INTERNAL_ERROR — mọi mã lỗi nội bộ lọt tới api đều thành mã này
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    FileUnavailable:
      description: FILE_UNAVAILABLE — mất object hoặc lệch checksum (ADR-014)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  schemas:
    # ------------------------------------------------------------------ nền
    Uuid:
      type: string
      format: uuid
    Timestamp:
      type: string
      format: date-time
    RequestTypeCode:
      description: Chuỗi theo mẫu, không phải enum đóng — F6 thêm loại mới không sửa code
      type: string
      pattern: '^[A-Z][A-Z_]*$'
    SlotName:
      type: string
      pattern: '^[a-z][a-z0-9_]*$'
    PermissionCode:
      type: string
      pattern: '^[a-z_]+\.[a-z_]+$'
    Page:
      type: object
      required: [next_cursor]
      properties:
        next_cursor:
          type: [string, 'null']

    # ------------------------------------------------------------------ enum (GLOSSARY.md)
    RequestStatus:
      type: string
      enum: [DRAFT, NEEDS_INFO, SUBMITTED, IN_REVIEW, CHANGES_REQUESTED, APPROVED, FULFILLED, REJECTED, CANCELLED, EXPIRED]
    DocumentStatus:
      type: string
      enum: [DRAFT, PENDING_APPROVAL, CHANGES_REQUESTED, REJECTED, APPROVED, PENDING_SIGNATURE, SIGNED, PENDING_SEAL, SEALED, ISSUED, REVOKED, SUPERSEDED, ARCHIVED]
    ReviewQueueStatus:
      type: string
      enum: [PENDING_APPROVAL, PENDING_SIGNATURE, PENDING_SEAL]
    RequestListScope:
      type: string
      enum: [OWN, ALL, ASSIGNED]
    SlotSource:
      type: string
      enum: [USER_INPUT, HR_PROFILE, RESOURCE_CATALOG, UPLOAD, SYSTEM]
    SlotSensitivity:
      type: string
      enum: [INT, PER, RES]
    SlotValueStatus:
      type: string
      enum: [PROVIDED, PROPOSED, CONFIRMED, SYSTEM_SET, ERASED]
    SlotDataType:
      type: string
      enum: [STRING, TEXT, INT, DATE, TIMESTAMP, ENUM, LIST, BOOL, FILE]
    ApprovalStepKind:
      type: string
      enum: [CONTENT_REVIEW, SIGNATURE, SEAL, BOOKING_CONFIRM]
    ApprovalStepStatus:
      type: string
      enum: [OPEN, DECIDED, CANCELLED]
    ChatSessionStatus:
      type: string
      enum: [OPEN, CLOSED]
    ChatSessionCloseReason:
      type: string
      enum: [IDLE_TIMEOUT, REQUEST_EXPIRED]
    ChatMessageAuthor:
      type: string
      enum: [EMPLOYEE, AGENT]
    RenderKind:
      type: string
      enum: [DRAFT, FINAL]
    PinReason:
      type: string
      enum: [APPROVED_CONTENT, ISSUED]
    DecisionKind:
      type: string
      enum: [SUBMITTED, RESUBMITTED, REQUEST_CANCELLED, APPROVED, CHANGES_REQUESTED, REJECTED, SIGNED, SEALED, ISSUE_ORDERED, REVOKE_INITIATED, REVOKE_CONFIRMED, TAKEOVER_RESOLVED, BOOKING_CONFIRMED]
    DecisionTextKind:
      type: string
      enum: [CHANGE_REASON, REJECTION_REASON, REVOCATION_REASON]
    ChangeScope:
      type: string
      enum: [FREE_CONTENT, SLOT_DATA]
    SealType:
      type: string
      enum: [ORGANIZATION_ROUND, TITLE_STAMP, OVERLAP_STAMP, EDGE_STAMP]
    OperatingMode:
      type: string
      enum: [NON_PRODUCTION, PRODUCTION]
    RequestTypeSupportStatus:
      type: string
      enum: [SUPPORTED, KNOWN_UNSUPPORTED]
    ArtifactKind:
      type: string
      enum: [DOCUMENT, ROOM_BOOKING, SEAL_ACTION]
    TemplateVariableKind:
      type: string
      enum: [DIRECT_SLOT, FREE_CONTENT, SYSTEM]
    TemplateVersionStatus:
      type: string
      enum: [UPLOADED, ACTIVE, RETIRED]
    AuditSeverity:
      type: string
      enum: [INFO, WARNING]
    AuditActorKind:
      type: string
      enum: [EMPLOYEE, SYSTEM]
    ProcedureVisibility:
      type: string
      enum: [ORG_WIDE, DEPARTMENT_ONLY]
    TurnStage:
      type: string
      enum: [UNDERSTANDING, LOOKING_UP, PREPARING_REPLY]
    SignalTopic:
      type: string
      enum: [NOTIFICATIONS, MY_REQUESTS, REVIEW_QUEUE]
    PendingQuestionKind:
      type: string
      enum: [CLARIFY_TYPE, ASK_SLOT, CONFIRM_PROPOSALS, OFFER_SUBMIT, OFFER_NEXT_INTENT, EXPLAIN_TERMINAL]

    # ------------------------------------------------------------------ lỗi
    ErrorCode:
      description: Danh mục ở mục Mã lỗi của 05-api.md — nguồn duy nhất
      type: string
      enum:
        - UNAUTHENTICATED
        - INVALID_CREDENTIALS
        - CSRF_HEADER_MISSING
        - PERMISSION_DENIED
        - SELF_APPROVAL_BLOCKED
        - NOT_FOUND
        - NOT_ACCEPTABLE
        - IDEMPOTENCY_KEY_REQUIRED
        - IDEMPOTENCY_KEY_CONFLICT
        - STATE_CONFLICT
        - SEPARATION_OF_DUTIES_VIOLATION
        - REQUEST_NOT_EDITABLE
        - SLOT_NOT_PROPOSED
        - SLOT_VALUE_STALE
        - REQUEST_NOT_CANCELLABLE
        - CHAT_SESSION_CLOSED
        - TURN_IN_PROGRESS
        - TURN_NOT_FINISHED
        - USE_SENSITIVITY_CHANGE
        - DESTRUCTIVE_COUNT_CHANGED
        - PAYLOAD_TOO_LARGE
        - UNSUPPORTED_MEDIA_TYPE
        - VALIDATION_FAILED
        - SELF_APPROVAL_REASON_REQUIRED
        - REQUEST_NOT_READY
        - CHANGE_TARGET_INVALID
        - TEMPLATE_VARIABLES_INVALID
        - IMPORT_ROWS_INVALID
        - DESTRUCTIVE_CONFIRMATION_REQUIRED
        - INTERNAL_ERROR
        - FILE_UNAVAILABLE
    FieldErrorCode:
      type: string
      enum: [REQUIRED, BLANK, INVALID_FORMAT, OUT_OF_RANGE, NOT_ALLOWED, TOO_LONG]
    VariableErrorCode:
      type: string
      enum: [MISSING_REQUIRED, NOT_IN_FILE, NOT_IN_MANIFEST, INPUT_NOT_ALLOWED, SOURCE_SLOT_UNKNOWN]
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [error_code, message, trace_id]
      properties:
        error_code: { $ref: '#/components/schemas/ErrorCode' }
        message:
          description: Tiếng Việt, nói rõ cần làm gì tiếp. Không bao giờ chứa giá trị slot
          type: string
        trace_id: { type: string }
        details: { $ref: '#/components/schemas/ErrorDetails' }
    ErrorDetails:
      description: Chỉ tên, mã, số đếm — không giá trị
      type: object
      additionalProperties: false
      properties:
        permission: { $ref: '#/components/schemas/PermissionCode' }
        current_status: { type: string }
        close_reason: { $ref: '#/components/schemas/ChatSessionCloseReason' }
        slot_names:
          type: array
          items: { $ref: '#/components/schemas/SlotName' }
        missing_slots:
          type: array
          items: { $ref: '#/components/schemas/SlotName' }
        unconfirmed_slots:
          type: array
          items: { $ref: '#/components/schemas/SlotName' }
        failed_rules:
          type: array
          items: { $ref: '#/components/schemas/FailedRule' }
        targets:
          type: array
          items: { type: string }
        fields:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [field, code]
            properties:
              field: { type: string }
              code: { $ref: '#/components/schemas/FieldErrorCode' }
        variables:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [variable_name, code]
            properties:
              variable_name: { type: string }
              code: { $ref: '#/components/schemas/VariableErrorCode' }
        rows:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [row_number, column, code]
            properties:
              row_number: { type: integer, minimum: 1 }
              column: { type: string }
              code: { $ref: '#/components/schemas/FieldErrorCode' }
        erase_count: { type: integer, minimum: 0 }
        message_saved: { type: boolean }
        turn_abandoned: { type: boolean }
        retry_after_seconds: { type: integer, minimum: 0 }
    FailedRule:
      type: object
      additionalProperties: false
      required: [slot_name, rule_code]
      properties:
        slot_name: { $ref: '#/components/schemas/SlotName' }
        rule_code: { type: string }

    # ------------------------------------------------------------------ người, phiên
    EmployeeBrief:
      type: object
      required: [id, employee_code, full_name]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        employee_code: { type: string }
        full_name: { type: string }
    Me:
      type: object
      required: [employee, permissions, operating_mode]
      properties:
        employee:
          allOf:
            - $ref: '#/components/schemas/EmployeeBrief'
            - type: object
              required: [department_code, department_name, job_title]
              properties:
                department_code: { type: string }
                department_name: { type: string }
                job_title: { type: string }
        permissions:
          description: Permission hiệu lực — gói vai trò cộng quyền cấp lẻ còn hiệu lực
          type: array
          items: { $ref: '#/components/schemas/PermissionCode' }
        operating_mode: { $ref: '#/components/schemas/OperatingMode' }
    LoginBody:
