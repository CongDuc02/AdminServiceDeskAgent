openapi: 3.1.0
info:
  title: BO-19 Admin Service Desk Agent API
  version: 0.1.0
  description: |
    Contract máy đọc được của `docs/design/05-api.md` (Phase 5). Diễn giải, lý do và
    giới hạn nằm ở file đó; file này không lặp lại lập luận.

    Phạm vi: khớp đúng tập endpoint có contract ở mục Endpoint của `05-api.md`.
    Endpoint mang nhãn `[NGOÀI-OPENAPI]` KHÔNG có ở đây — vắng mặt của chúng không
    phải lỗi lệch (mục Nguyên tắc chung của `05-api.md`).

    Extension dùng trong file:
      x-bo19-operation          tên thao tác của tool_layer (GLOSSARY.md mục 12, 05-api.md mục 2.1)
      x-bo19-permission         permission cần có (D-005 — permission, không phải vai trò)
      x-bo19-permission-status  NOT_IN_CATALOG_A042 khi permission chưa có trong danh mục
      x-bo19-execution          SYNC | SYNC_ENQUEUE | SYNC_OBJECT_STORAGE | SYNC_GRAPH | STREAM
      x-bo19-enqueues           loại job enqueue trong cùng giao dịch
      x-bo19-idempotency-key    dòng chính mà Idempotency-Key phải bằng id của nó; "none" nếu không cần
      x-bo19-feature            feature ở PRD
      x-bo19-scope              Should — hạng mục bị cắt khỏi Sprint đầu
      x-bo19-sse-events         tên sự kiện SSE -> schema của trường data

    Mọi lệnh không phải GET bắt buộc header X-BO19-CSRF. Mọi response lỗi có đủ
    error_code, message, trace_id.
servers:
  - url: /api/v1
security:
  - sessionCookie: []
tags:
  - name: auth
  - name: chat
  - name: requests
  - name: documents
  - name: files
  - name: notifications
  - name: config
  - name: audit
  - name: delegations

paths:
  /auth/session:
    post:
      tags: [auth]
      operationId: createSession
      summary: Đăng nhập
      description: Sai mã nhân viên hay sai mật khẩu đều trả INVALID_CREDENTIALS. Vòng đời credential ở A-048.
      security: []
      x-bo19-execution: SYNC
      x-bo19-idempotency-key: none
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginBody' }
      responses:
        '204':
          description: Đã tạo phiên
          headers:
            Set-Cookie:
              description: bo19_session; HttpOnly; Secure; SameSite=Strict; Path=/api
              schema: { type: string }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '500': { $ref: '#/components/responses/InternalError' }
    delete:
      tags: [auth]
      operationId: deleteSession
      summary: Đăng xuất
      x-bo19-execution: SYNC
      x-bo19-idempotency-key: none
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '204': { description: Đã huỷ phiên }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }

  /me:
    get:
      tags: [auth]
      operationId: getMe
      summary: Nhân viên đang đăng nhập, permission hiệu lực, chế độ vận hành
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '500': { $ref: '#/components/responses/InternalError' }

  /chat-sessions:
    post:
      tags: [chat]
      operationId: openChatSession
      summary: Lấy phiên đang mở hoặc mở phiên mới
      x-bo19-operation: chat_session_open
      x-bo19-permission: [request.create, request.create_on_behalf]
      x-bo19-execution: SYNC
      x-bo19-idempotency-key: chat_session
      x-bo19-feature: F1
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Phiên đang mở có sẵn
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChatSession' }
        '201':
          description: Phiên mới
          headers:
            Idempotent-Replayed: { $ref: '#/components/headers/IdempotentReplayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChatSession' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }

  /chat-sessions/{chat_session_id}:
    parameters:
      - $ref: '#/components/parameters/ChatSessionId'
    get:
      tags: [chat]
      operationId: getChatSession
      summary: Một phiên — chỉ chủ phiên
      x-bo19-feature: F1
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChatSession' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /chat-sessions/{chat_session_id}/messages:
    parameters:
      - $ref: '#/components/parameters/ChatSessionId'
    get:
      tags: [chat]
      operationId: listChatMessages
      summary: Tin nhắn của phiên, seq giảm dần — chỉ chủ phiên
      description: Nguồn có thẩm quyền của mọi lượt chat. Index uq_chat_message_seq.
      x-bo19-feature: F1
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChatMessagePage' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '500': { $ref: '#/components/responses/InternalError' }

  /chat-sessions/{chat_session_id}/turns:
    parameters:
      - $ref: '#/components/parameters/ChatSessionId'
    post:
      tags: [chat]
      operationId: postChatTurn
      summary: Một lượt chat — response là stream lượt chat
      description: |
        Chủ phiên. Lỗi trước khi stream bắt đầu trả JSON ErrorEnvelope; lỗi sau đó đi thành sự kiện turn.error.
        Mọi lượt đã nhận kết thúc bằng đúng một chat_message của agent (mục SSE của 05-api.md).
      x-bo19-operation: chat_message_append
      x-bo19-permission: [request.create, request.create_on_behalf]
      x-bo19-execution: SYNC_GRAPH
      x-bo19-idempotency-key: chat_message
      x-bo19-feature: F1
      x-bo19-sse-events:
        turn.accepted: { $ref: '#/components/schemas/TurnAcceptedEvent' }
        turn.progress: { $ref: '#/components/schemas/TurnProgressEvent' }
        turn.reply: { $ref: '#/components/schemas/TurnReplyEvent' }
        turn.error: { $ref: '#/components/schemas/ErrorEnvelope' }
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/AcceptEventStream'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TurnBody' }
      responses:
        '200':
          description: Stream lượt chat
          headers:
            Idempotent-Replayed: { $ref: '#/components/headers/IdempotentReplayed' }
          content:
            text/event-stream:
              schema: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '406': { $ref: '#/components/responses/NotAcceptable' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '500': { $ref: '#/components/responses/InternalError' }

  /requests:
    get:
      tags: [requests]
      operationId: listRequests
      summary: Danh sách request
      description: |
        OWN — do mình tạo, index ix_request_created_by. ALL — mặc định lọc bốn trạng thái mở sau SUBMITTED,
        sắp theo status_changed_at, CHƯA có index (Open Questions của 05-api.md). ASSIGNED — index ix_approval_step_assignee.
      x-bo19-permission: [request.read_own, request.read_all, request.read_assigned]
      x-bo19-feature: F4
      parameters:
        - name: scope
          in: query
          required: true
          schema: { $ref: '#/components/schemas/RequestListScope' }
        - name: status
          in: query
          required: false
          schema: { $ref: '#/components/schemas/RequestStatus' }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RequestSummaryPage' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '500': { $ref: '#/components/responses/InternalError' }

  /requests/{request_id}:
    parameters:
      - $ref: '#/components/parameters/RequestId'
    get:
      tags: [requests]
      operationId: getRequest
      summary: Chi tiết request — slot, còn thiếu gì, cần sửa gì, artifact
      x-bo19-permission: [request.read_own, request.read_all, request.read_assigned]
      x-bo19-feature: F4
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RequestDetail' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /requests/{request_id}/actions/confirm-slots:
    parameters:
      - $ref: '#/components/parameters/RequestId'
    post:
      tags: [requests]
      operationId: confirmSlots
      summary: Xác nhận từng giá trị đề xuất
      description: Chỉ UPDATE có điều kiện; không cần Idempotency-Key. Không có chế độ xác nhận tất cả.
      x-bo19-operation: request_slot_confirm
      x-bo19-permission: [request.supply_info]
      x-bo19-execution: SYNC
      x-bo19-idempotency-key: none
      x-bo19-feature: F1
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SlotConfirmBody' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RequestDetail' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '500': { $ref: '#/components/responses/InternalError' }

  /requests/{request_id}/actions/submit:
    parameters:
      - $ref: '#/components/parameters/RequestId'
    post:
      tags: [requests]
      operationId: submitRequest
      summary: Gửi, hoặc gửi lại ở ca SLOT_DATA
      x-bo19-operation: request_submit
      x-bo19-permission: [request.create, request.supply_info]
      x-bo19-execution: SYNC_ENQUEUE
      x-bo19-enqueues: [render_document, resume_document_graph]
      x-bo19-idempotency-key: decision_record (SUBMITTED | RESUBMITTED)
      x-bo19-feature: F1
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SubmitBody' }
      responses:
        '200':
          description: OK
          headers:
            Idempotent-Replayed: { $ref: '#/components/headers/IdempotentReplayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DecisionResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '500': { $ref: '#/components/responses/InternalError' }

  /requests/{request_id}/actions/cancel:
    parameters:
      - $ref: '#/components/parameters/RequestId'
    post:
      tags: [requests]
      operationId: cancelRequest
      summary: Huỷ — chỉ từ DRAFT, hoặc CHANGES_REQUESTED ca SLOT_DATA
      x-bo19-operation: request_cancel
      x-bo19-permission: [request.cancel_own]
      x-bo19-execution: SYNC_ENQUEUE
      x-bo19-enqueues: [resume_document_graph]
      x-bo19-idempotency-key: decision_record (REQUEST_CANCELLED)
      x-bo19-feature: F1
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CancelBody' }
      responses:
        '200':
          description: OK
          headers:
            Idempotent-Replayed: { $ref: '#/components/headers/IdempotentReplayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DecisionResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }

  /review-queue:
    get:
      tags: [documents]
      operationId: listReviewQueue
      summary: Hàng đợi một trạng thái chờ, chờ lâu nhất trước
      description: status bắt buộc, một giá trị, để đi đúng ix_document_review_queue.
      x-bo19-permission: [document.approve_content, document.sign, document.apply_seal]
      x-bo19-feature: F4
      parameters:
        - name: status
          in: query
          required: true
          schema: { $ref: '#/components/schemas/ReviewQueueStatus' }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReviewQueuePage' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '500': { $ref: '#/components/responses/InternalError' }

  /issue-queue:
    get:
      tags: [documents]
      operationId: listIssueQueue
      summary: Văn bản SIGNED không cần dấu hoặc SEALED, chờ lệnh phát hành
      description: Chưa có index cho thứ tự này (Open Questions của 05-api.md).
      x-bo19-permission: [document.issue]
      x-bo19-feature: F3
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReviewQueuePage' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '500': { $ref: '#/components/responses/InternalError' }

  /documents/{document_id}:
    parameters:
      - $ref: '#/components/parameters/DocumentId'
    get:
      tags: [documents]
      operationId: getDocumentForReview
      summary: Màn hình duyệt
      x-bo19-permission: [request.read_all, request.read_assigned]
      x-bo19-feature: F2
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocumentReviewView' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /documents/{document_id}/actions/approve-content:
    parameters:
      - $ref: '#/components/parameters/DocumentId'
    post:
      tags: [documents]
      operationId: approveContent
      summary: Duyệt nội dung — cổng HITL số 1
      x-bo19-operation: document_approve_content
      x-bo19-permission: [document.approve_content]
      x-bo19-execution: SYNC_ENQUEUE
      x-bo19-enqueues: [resume_document_graph]
      x-bo19-idempotency-key: decision_record (APPROVED)
      x-bo19-feature: F3
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApproveContentBody' }
      responses:
        '200': { $ref: '#/components/responses/DecisionOk' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '500': { $ref: '#/components/responses/InternalError' }

  /documents/{document_id}/actions/request-changes:
    parameters:
      - $ref: '#/components/parameters/DocumentId'
    post:
      tags: [documents]
      operationId: requestChanges
      summary: Yêu cầu sửa — từ PENDING_APPROVAL hoặc PENDING_SIGNATURE
      x-bo19-operation: document_request_changes
      x-bo19-permission: [document.request_changes]
      x-bo19-execution: SYNC_ENQUEUE
      x-bo19-enqueues: [resume_document_graph]
      x-bo19-idempotency-key: decision_record (CHANGES_REQUESTED)
      x-bo19-feature: F3
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RequestChangesBody' }
      responses:
        '200': { $ref: '#/components/responses/DecisionOk' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '500': { $ref: '#/components/responses/InternalError' }

  /documents/{document_id}/actions/reject:
    parameters:
      - $ref: '#/components/parameters/DocumentId'
    post:
      tags: [documents]
      operationId: rejectDocument
      summary: Từ chối kèm lý do
      x-bo19-operation: document_reject
      x-bo19-permission: [document.reject]
      x-bo19-execution: SYNC_ENQUEUE
      x-bo19-enqueues: [resume_document_graph]
      x-bo19-idempotency-key: decision_record (REJECTED)
      x-bo19-feature: F3
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RejectBody' }
      responses:
        '200': { $ref: '#/components/responses/DecisionOk' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '500': { $ref: '#/components/responses/InternalError' }

  /documents/{document_id}/actions/sign:
    parameters:
      - $ref: '#/components/parameters/DocumentId'
    post:
      tags: [documents]
      operationId: signDocument
      summary: Ghi nhận ký
      x-bo19-operation: document_sign
      x-bo19-permission: [document.sign]
      x-bo19-execution: SYNC_ENQUEUE
      x-bo19-enqueues: [resume_document_graph]
      x-bo19-idempotency-key: decision_record (SIGNED)
      x-bo19-feature: F3
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SignBody' }
      responses:
        '200': { $ref: '#/components/responses/DecisionOk' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '500': { $ref: '#/components/responses/InternalError' }

  /documents/{document_id}/actions/apply-seal:
    parameters:
      - $ref: '#/components/parameters/DocumentId'
    post:
      tags: [documents]
      operationId: applySeal
      summary: Duyệt dấu — cổng HITL số 2
      description: seal_type lấy từ document, không nhận từ client.
      x-bo19-operation: document_apply_seal
      x-bo19-permission: [document.apply_seal]
      x-bo19-execution: SYNC_ENQUEUE
      x-bo19-enqueues: [resume_document_graph]
      x-bo19-idempotency-key: decision_record (SEALED)
      x-bo19-feature: F3
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
