        variable_guidance:
          type: [string, 'null']
        max_length:
          type: [integer, 'null']
          minimum: 1
        inputs:
          description: Danh sách input tự khai — chỉ biến FREE_CONTENT có phần tử
          type: array
          items: { $ref: '#/components/schemas/SlotName' }
    TemplateVersion:
      type: object
      required: [id, template_id, version_no, status, uploaded_by_employee_id, activated_at, retired_at, created_at, row_version, variables]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        template_id: { $ref: '#/components/schemas/Uuid' }
        version_no: { type: integer, minimum: 1 }
        status: { $ref: '#/components/schemas/TemplateVersionStatus' }
        uploaded_by_employee_id: { $ref: '#/components/schemas/Uuid' }
        activated_at:
          anyOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        retired_at:
          anyOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        created_at: { $ref: '#/components/schemas/Timestamp' }
        row_version: { type: integer, minimum: 1 }
        variables:
          type: array
          items: { $ref: '#/components/schemas/TemplateVariableView' }
    Template:
      allOf:
        - $ref: '#/components/schemas/TemplateSummary'
        - type: object
          required: [versions]
          properties:
            versions:
              type: array
              items: { $ref: '#/components/schemas/TemplateVersion' }
    TemplateCreateBody:
      type: object
      additionalProperties: false
      required: [code, request_type_code, name]
      properties:
        code: { type: string, minLength: 1 }
        request_type_code: { $ref: '#/components/schemas/RequestTypeCode' }
        name: { type: string, minLength: 1 }
    TemplateVariableDecl:
      type: object
      additionalProperties: false
      required: [variable_name, kind]
      properties:
        variable_name: { type: string, pattern: '^[a-z][a-z0-9_]*$' }
        kind: { $ref: '#/components/schemas/TemplateVariableKind' }
        source_slot_name:
          anyOf:
            - $ref: '#/components/schemas/SlotName'
            - type: 'null'
        fill_after_approval: { type: boolean, default: false }
        variable_guidance:
          type: [string, 'null']
        max_length:
          type: [integer, 'null']
          minimum: 1
        inputs:
          type: array
          items: { $ref: '#/components/schemas/SlotName' }
    TemplateManifest:
      type: object
      additionalProperties: false
      required: [variables]
      properties:
        variables:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/TemplateVariableDecl' }
    TemplateVersionUpload:
      type: object
      required: [file, manifest]
      properties:
        file:
          type: string
          contentMediaType: application/vnd.openxmlformats-officedocument.wordprocessingml.document
        manifest: { $ref: '#/components/schemas/TemplateManifest' }
    ActivateBody:
      type: object
      additionalProperties: false
      required: [expected_row_version]
      properties:
        expected_row_version: { type: integer, minimum: 1 }

    # ------------------------------------------------------------------ nhân viên
    EmployeeImportUpload:
      type: object
      required: [file, source_label]
      properties:
        file:
          type: string
          contentMediaType: text/csv
        source_label: { type: string, minLength: 1 }
    EmployeeImportResult:
      description: Chỉ mã và số đếm — không giá trị cũ hay mới
      type: object
      required: [import_id, source, synced_at, inserted_count, updated_count, unchanged_count, updated]
      properties:
        import_id:
          description: id của audit_event của đợt import
          allOf:
            - $ref: '#/components/schemas/Uuid'
        source: { type: string }
        synced_at: { $ref: '#/components/schemas/Timestamp' }
        inserted_count: { type: integer, minimum: 0 }
        updated_count: { type: integer, minimum: 0 }
        unchanged_count: { type: integer, minimum: 0 }
        updated:
          type: array
          items:
            type: object
            required: [employee_code, changed_fields]
            properties:
              employee_code: { type: string }
              changed_fields:
                type: array
                items: { type: string }

    # ------------------------------------------------------------------ kho quy trình
    ProcedureVersion:
      type: object
      required: [id, procedure_document_id, version_no, procedure_visibility, department_scope, effective_from, is_active, activated_at, deactivated_at, ingested_by_employee_id, row_version]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        procedure_document_id: { $ref: '#/components/schemas/Uuid' }
        version_no: { type: integer, minimum: 1 }
        procedure_visibility: { $ref: '#/components/schemas/ProcedureVisibility' }
        department_scope:
          type: [array, 'null']
          items: { type: string }
        effective_from: { type: string, format: date }
        is_active: { type: boolean }
        activated_at:
          anyOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        deactivated_at:
          anyOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        ingested_by_employee_id: { $ref: '#/components/schemas/Uuid' }
        row_version: { type: integer, minimum: 1 }
    ProcedureDocument:
      type: object
      required: [id, code, title, versions]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        code: { type: string }
        title: { type: string }
        versions:
          type: array
          items: { $ref: '#/components/schemas/ProcedureVersion' }
    ProcedurePage:
      allOf:
        - $ref: '#/components/schemas/Page'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/ProcedureDocument' }
    ProcedureUploadMetadata:
      type: object
      additionalProperties: false
      required: [procedure_code, title, procedure_visibility, department_scope, effective_from, pii_free_attested]
      properties:
        procedure_code: { type: string, minLength: 1 }
        title: { type: string, minLength: 1 }
        procedure_visibility: { $ref: '#/components/schemas/ProcedureVisibility' }
        department_scope:
          description: null khi và chỉ khi ORG_WIDE; không rỗng khi DEPARTMENT_ONLY
          type: [array, 'null']
          minItems: 1
          items: { type: string }
        effective_from: { type: string, format: date }
        pii_free_attested:
          description: Cam kết của người nạp (A-033)
          const: true
    ProcedureUpload:
      type: object
      required: [file, metadata]
      properties:
        file: { type: string }
        metadata: { $ref: '#/components/schemas/ProcedureUploadMetadata' }
    DeactivateBody:
      type: object
      additionalProperties: false
      required: [expected_row_version]
      properties:
        expected_row_version: { type: integer, minimum: 1 }

    # ------------------------------------------------------------------ cấu hình loại yêu cầu
    SlotDefinitionConfig:
      type: object
      required: [request_type_code, slot_name, data_type, source, sensitivity, is_required, validation_rules, description, display_order, row_version]
      properties:
        request_type_code: { $ref: '#/components/schemas/RequestTypeCode' }
        slot_name: { $ref: '#/components/schemas/SlotName' }
        data_type: { $ref: '#/components/schemas/SlotDataType' }
        source: { $ref: '#/components/schemas/SlotSource' }
        sensitivity: { $ref: '#/components/schemas/SlotSensitivity' }
        is_required: { type: boolean }
        validation_rules: { type: object }
        description: { type: string }
        display_order: { type: integer }
        row_version: { type: integer, minimum: 1 }
    RequestTypeConfig:
      type: object
      required: [code, name_vi, description, support_status, artifact_kind, requires_seal_default, seal_type_default, document_register_id, sla_target, example_phrases, row_version]
      properties:
        code: { $ref: '#/components/schemas/RequestTypeCode' }
        name_vi: { type: string }
        description: { type: string }
        support_status: { $ref: '#/components/schemas/RequestTypeSupportStatus' }
        artifact_kind: { $ref: '#/components/schemas/ArtifactKind' }
        requires_seal_default:
          type: [boolean, 'null']
        seal_type_default:
          anyOf:
            - $ref: '#/components/schemas/SealType'
            - type: 'null'
        document_register_id:
          anyOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        sla_target:
          description: Khoảng thời gian ISO 8601; TBD (A-002)
          type: [string, 'null']
        example_phrases:
          type: array
          items: { type: string }
        row_version: { type: integer, minimum: 1 }
        slots:
          description: Chỉ có ở GET một loại
          type: array
          items: { $ref: '#/components/schemas/SlotDefinitionConfig' }
    RequestTypeConfigPage:
      allOf:
        - $ref: '#/components/schemas/Page'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/RequestTypeConfig' }
    RequestTypeUpsertBody:
      type: object
      additionalProperties: false
      required: [name_vi, description, support_status, artifact_kind, example_phrases]
      properties:
        name_vi: { type: string, minLength: 1 }
        description: { type: string, minLength: 1 }
        support_status: { $ref: '#/components/schemas/RequestTypeSupportStatus' }
        artifact_kind: { $ref: '#/components/schemas/ArtifactKind' }
        requires_seal_default:
          type: [boolean, 'null']
        seal_type_default:
          anyOf:
            - $ref: '#/components/schemas/SealType'
            - type: 'null'
        document_register_id:
          anyOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        sla_target:
          type: [string, 'null']
        example_phrases:
          type: array
          items: { type: string }
        expected_row_version:
          description: Vắng là tạo mới; có là sửa có điều kiện
          type: [integer, 'null']
          minimum: 1
    SlotDefinitionUpsertBody:
      type: object
      additionalProperties: false
      required: [data_type, source, sensitivity, is_required, validation_rules, description, display_order]
      properties:
        data_type: { $ref: '#/components/schemas/SlotDataType' }
        source: { $ref: '#/components/schemas/SlotSource' }
        sensitivity:
          description: Với slot đã có, phải bằng độ nhạy hiện hành — khác thì USE_SENSITIVITY_CHANGE
          allOf:
            - $ref: '#/components/schemas/SlotSensitivity'
        is_required: { type: boolean }
        validation_rules: { type: object }
        description: { type: string, minLength: 1 }
        display_order: { type: integer }
        expected_row_version:
          type: [integer, 'null']
          minimum: 1
    SensitivityChangePreview:
      type: object
      required: [slot_name, from, to, destructive, erase_count]
      properties:
        slot_name: { $ref: '#/components/schemas/SlotName' }
        from: { $ref: '#/components/schemas/SlotSensitivity' }
        to: { $ref: '#/components/schemas/SlotSensitivity' }
        destructive: { type: boolean }
        erase_count: { type: integer, minimum: 0 }
    ChangeSensitivityBody:
      type: object
      additionalProperties: false
      required: [to, expected_row_version]
      properties:
        to: { $ref: '#/components/schemas/SlotSensitivity' }
        expected_row_version: { type: integer, minimum: 1 }
        expected_erase_count:
          description: Bắt buộc khi thay đổi là phá huỷ
          type: [integer, 'null']
          minimum: 0
    SensitivityChangeResult:
      type: object
      required: [slot_name, from, to, erased_count]
      properties:
        slot_name: { $ref: '#/components/schemas/SlotName' }
        from: { $ref: '#/components/schemas/SlotSensitivity' }
        to: { $ref: '#/components/schemas/SlotSensitivity' }
        erased_count: { type: integer, minimum: 0 }

    # ------------------------------------------------------------------ uỷ quyền [Should]
    Delegation:
      type: object
      required: [id, delegator_employee_id, delegate_employee_id, permission_code, valid_from, valid_to, revoked_at, row_version]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        delegator_employee_id: { $ref: '#/components/schemas/Uuid' }
        delegate_employee_id: { $ref: '#/components/schemas/Uuid' }
        permission_code: { $ref: '#/components/schemas/PermissionCode' }
        valid_from: { $ref: '#/components/schemas/Timestamp' }
        valid_to: { $ref: '#/components/schemas/Timestamp' }
        revoked_at:
          anyOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        row_version: { type: integer, minimum: 1 }
    DelegationPage:
      allOf:
        - $ref: '#/components/schemas/Page'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/Delegation' }
    DelegationCreateBody:
      type: object
      additionalProperties: false
      required: [delegator_employee_id, delegate_employee_id, permission_code, valid_from, valid_to]
      properties:
        delegator_employee_id: { $ref: '#/components/schemas/Uuid' }
        delegate_employee_id: { $ref: '#/components/schemas/Uuid' }
        permission_code: { $ref: '#/components/schemas/PermissionCode' }
        valid_from: { $ref: '#/components/schemas/Timestamp' }
        valid_to: { $ref: '#/components/schemas/Timestamp' }
    RevokeDelegationBody:
      type: object
      additionalProperties: false
      required: [expected_row_version]
      properties:
        expected_row_version: { type: integer, minimum: 1 }
